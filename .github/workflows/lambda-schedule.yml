name: Update DB

# APY-7 Fix: Least privilege principle applied. Restrict GITHUB_TOKEN to only required rights.
permissions:
  contents: write

# APY-7 Fix: Added a non-canceling concurrency group
concurrency:
  group: update-db
  cancel-in-progress: false

on:
  schedule:
    - cron: '10/20 0/1 * * *'
jobs:
  build:
    name: Trigger Lambda Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    # APY-7 Fix: Migrated all workflow usages to v4 actions
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # APY-7 Fix: Pin external setup action to an exact immutable commit SHA
    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      name: Install pnpm
      id: pnpm-install
      with:
        version: 8
        run_install: false

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      name: Setup pnpm cache
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build project
      run: pnpm run build

    - name: Get prices
      env:
        RPC_URL: ${{ secrets.RPC_URL }}
      run: ./update-prices.bash

    - name: Prune prices
      run: ./prune-prices.bash

    - name: Commit changes
      run: |
        git config --global user.name 'Lambda - Automatic Price Updator'
        git config --global user.email 'lambda@noreply.glitchful.dev'
        git add db
        
        # APY-7 Fix: The if/else shell chain is correctly replacing unstable &&/|| operators.
        if [ -n "$(git status --porcelain)" ]; then
          git commit -m "automated price update"
          git push
        else
          echo "No changes to be committed"
        fi
